<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduPredict</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b42;font:15px system-ui}aside{position:fixed;width:240px;height:100vh;background:#142b46;color:white;padding:24px 16px}aside h2{margin:0 0 8px}aside small{color:#a8c4de}nav{margin-top:30px}nav button{display:block;width:100%;text-align:left;background:none;color:#dce8f5;border:0;padding:13px;border-radius:8px;cursor:pointer}nav button:hover,nav button.active{background:#285577}main{margin-left:240px;padding:35px;max-width:1450px}h1{font-size:30px;margin:0 0 8px}p{line-height:1.6;color:#526579}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 4px 16px #18345108}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.metric{font-size:32px;font-weight:700;color:#176d9b}label{display:block;font-weight:600;margin:10px 0 6px}input,select{width:100%;padding:11px;border:1px solid #cbd8e5;border-radius:7px;background:white;color:#172b42}button.primary{background:#176d9b;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;margin:12px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #e4ebf2}th{background:#edf4fa}.scroll{overflow:auto}.bar{height:13px;background:#2384b2;border-radius:4px;min-width:1px}.muted{color:#64748b;font-size:13px}.error{color:#b42318}.tag{background:#e4f2f9;padding:6px 10px;border-radius:20px;color:#176d9b} @media(max-width:700px){aside{position:static;width:100%;height:auto}nav{display:flex;flex-wrap:wrap;margin-top:12px}nav button{width:auto}main{margin:0;padding:16px}}
</style><aside><h2>EduPredict</h2><small>PHÂN TÍCH HỌC TẬP THPT</small><nav id="nav"></nav></aside><main id="main"></main><script>
const $=id=>document.getElementById(id), main=$('main');let D,M,last=null,history=[];const labels={studytime:'Thời gian tự học/tuần',absences:'Số lần vắng học',failures:'Số lần học trượt',Medu:'Học vấn mẹ',Fedu:'Học vấn bố',schoolsup:'Hỗ trợ nhà trường',famsup:'Hỗ trợ gia đình',G1:'Điểm G1 /10',G2:'Điểm G2 /10'};const pages=['Tổng quan','Dự báo học tập','Mô phỏng kịch bản','Dự báo hàng loạt','Lịch sử dự báo','Khám phá dữ liệu','Thực nghiệm mô hình','Độ quan trọng đặc trưng','Giới thiệu'];const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>Number(x).toFixed(3);const modeName=m=>m==='early'?'Không G1, G2':'Có G1, G2';async function api(url,opt){let r=await fetch(url,opt),j=await r.json();if(!r.ok)throw Error(j.detail);return j}function title(t,s){main.innerHTML=`<span class="tag">EduPredict / ${t}</span><h1 style="margin-top:20px">${t}</h1><p>${s}</p>`}function card(s){main.insertAdjacentHTML('beforeend',`<section class="card">${s}</section>`)}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function bars(obj){let max=Math.max(...Object.values(obj).map(Math.abs),.001);return Object.entries(obj).map(([k,v])=>`<div style="display:grid;grid-template-columns:150px 1fr 65px;gap:10px;align-items:center;margin:10px 0"><span>${esc(labels[k]||k)}</span><div class="bar" style="width:${Math.abs(v)/max*100}%;background:${v<0?'#d97706':'#2384b2'}"></div><span>${fmt(v)}</span></div>`).join('')}function download(rows){if(!rows.length)return;let keys=Object.keys(rows[0]);let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]).replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='edupredict.csv';a.click();URL.revokeObjectURL(a.href)}
function field(k,v){let opts=k==='studytime'?['Dưới 2 giờ','2–5 giờ','5–10 giờ','Trên 10 giờ']:['Medu','Fedu'].includes(k)?['Không có','Tiểu học','THCS','THPT','Đại học trở lên']:['schoolsup','famsup'].includes(k)?['Không','Có']:null;return `<div><label>${labels[k]}</label>${opts?`<select id="f_${k}">${opts.map((x,i)=>`<option value="${i+(k==='studytime'?1:0)}" ${Number(v)===i+(k==='studytime'?1:0)?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${k}" type="number" required min="0" max="${k==='absences'?93:k==='failures'?3:10}" step="${k.startsWith('G')?.5:1}" value="${v}">`}</div>`}const defaults={studytime:2,absences:4,failures:0,Medu:3,Fedu:3,schoolsup:0,famsup:1,G1:6,G2:6.5};function form(sim=false){let mode=sim?last.mode:'full',vals=sim?Object.fromEntries(Object.entries(last.values).map(([k,v])=>[k,k.startsWith('G')?v/2:v])):defaults;card(`<form id="form"><label>Kịch bản</label><select id="mode" ${sim?'disabled':''}><option value="full">Có G1, G2</option><option value="early" ${mode==='early'?'selected':''}>Không G1, G2</option></select><div class="grid" id="fields"></div><label>Mục tiêu điểm /10</label><input id="goal" type="number" min="0" max="10" step=".1" value="8" required><button class="primary">${sim?'So sánh kịch bản':'Dự báo kết quả'}</button></form><div id="result"></div>`);function fields(){ $('fields').innerHTML=Object.keys(defaults).filter(k=>$('mode').value==='full'||!k.startsWith('G')).map(k=>field(k,vals[k])).join('')}fields();$('mode').onchange=fields;$('form').onsubmit=async e=>{e.preventDefault();let result=$('result');result.textContent='Đang tính dự báo…';try{let mode=$('mode').value,values={};for(let k of Object.keys(defaults))if($('f_'+k))values[k]=Number($('f_'+k).value)*(k.startsWith('G')?2:1);let r=await api('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,values,model:sim?last.model:undefined})});result.innerHTML=`<hr><div class="grid"><div>Điểm dự báo<div class="metric">${r.score}/10</div></div><div>Mục tiêu<div class="metric">${$('goal').value}</div></div></div><p>${r.risk?'Cần xem xét hỗ trợ':'Không dưới ngưỡng cảnh báo 5 điểm'} · ${esc(r.model)}</p><p>Khoảng cách mục tiêu: ${Math.max(0,Number($('goal').value)-r.score).toFixed(2)} điểm</p>${sim?`<p>Ban đầu: ${last.score} · Chênh lệch: ${(r.score-last.score).toFixed(2)} điểm. Không suy ra quan hệ nhân quả.</p>`:''}<h3>Định hướng ôn tập</h3><ul>${r.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;if(!sim){last={...r,mode,values};history.push({time:new Date().toLocaleString(),mode:modeName(mode),model:r.model,score:r.score})}}catch(e){result.textContent=e.message}}}
async function show(i){document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));title(pages[i],'Dữ liệu UCI môn Toán · Công cụ hỗ trợ nghiên cứu và ôn tập');try{if(i===0||i===5){D=D||await api('/api/data');if(i===0){card(`<div class="grid">${[['Hồ sơ thật',D.count],['Thuộc tính',D.columns],['Điểm G3 trung bình',D.mean.toFixed(2)+'/10'],['Kịch bản',2]].map(([k,v])=>`<div>${k}<div class="metric">${v}</div></div>`).join('')}</div>`);card('<h3>Phân bố điểm G3 (thang 20)</h3>'+bars(D.distribution));card('<h3>Bắt đầu dự báo</h3><p>Chọn kịch bản có hoặc không có điểm các kỳ trước.</p><button class="primary" onclick="show(1)">Dự báo học tập</button>')}else{card(`<h3>Dữ liệu gốc · ${D.missing} ô thiếu</h3><input id="search" placeholder="Tìm trong dữ liệu"><div id="records"></div>`);let render=()=>{$('records').innerHTML=table(Object.keys(D.records[0]),D.records.filter(r=>JSON.stringify(r).toLowerCase().includes($('search').value.toLowerCase())).slice(0,100).map(Object.values))};$('search').oninput=render;render();card('<h3>Tương quan Pearson với G3</h3>'+bars(D.correlation))}}else if(i===1)form();else if(i===2){if(last)form(true);else card('Hãy thực hiện một dự báo cá nhân trước.')}else if(i===3){card(`<label>Kịch bản</label><select id="bm"><option value="full">Có G1, G2</option><option value="early">Không G1, G2</option></select><p>CSV sử dụng tên cột UCI, G1/G2 thang 20, hỗ trợ yes/no.</p><button class="primary" id="sample">Tải CSV mẫu</button><input type="file" id="file" accept=".csv"><button class="primary" id="run">Dự báo danh sách</button><div id="batch"></div>`);$('sample').onclick=()=>download([Object.fromEntries(Object.entries(defaults).filter(([k])=>$('bm').value==='full'||!k.startsWith('G')).map(([k,v])=>[k,k.startsWith('G')?v*2:v]))]);$('run').onclick=async()=>{try{let f=new FormData();f.append('file',$('file').files[0]);let r=await api('/api/batch/'+$('bm').value,{method:'POST',body:f});$('batch').innerHTML=table(['Mã','Điểm','Mô hình','Cảnh báo'],r.records.map(x=>[x.id,x.score,x.model,x.risk?'Có':'Không']))+'<button class="primary" id="export">Xuất CSV</button>';$('export').onclick=()=>download(r.records)}catch(e){$('batch').textContent=e.message}}}else if(i===4){card(table(['Thời gian','Kịch bản','Mô hình','Điểm'],history.map(Object.values))+'<button class="primary" onclick="download(history)">Xuất lịch sử</button><p>Lịch sử chỉ tồn tại trong phiên trình duyệt.</p>')}else if(i===6||i===7){card('Đang huấn luyện 10 mô hình trên dữ liệu thật…');M=M||await api('/api/models');title(pages[i],'80% huấn luyện · 20% kiểm tra · K-Fold 5 · random_state=42');if(i===6){card(table(['Kịch bản','Mô hình','CV MAE','MAE','RMSE','R²'],M.rows.map(r=>[modeName(r.mode),r.model,fmt(r.cv),fmt(r.mae),fmt(r.rmse),fmt(r.r2)])));for(let [k,v] of Object.entries(M.details)){card(`<h3>${modeName(k)} · ${esc(v.best)}</h3><p>Điểm thực tế và dự báo trên tập kiểm tra (thang 10)</p><svg viewBox="0 0 320 320" style="width:100%;max-width:420px"><path d="M30 290H290V30 M30 290L290 30" stroke="#9aafc2" fill="none"/>${v.actual.map((a,j)=>`<circle cx="${30+a*26}" cy="${290-v.predicted[j]*26}" r="3" fill="#176d9b" opacity=".6"/>`).join('')}<text x="120" y="310">Thực tế</text><text x="5" y="20">Dự báo</text></svg>`)} }else for(let [k,v] of Object.entries(M.details))card(`<h3>${modeName(k)} · ${esc(v.best)}</h3><p>Permutation importance trên tập kiểm tra: mức thay đổi MAE khi xáo trộn đặc trưng. Không phải quan hệ nhân quả.</p>`+bars(Object.fromEntries(Object.entries(v.importance).sort((a,b)=>b[1]-a[1]))))}else card('<h3>Phạm vi nghiên cứu</h3><p>UCI Student Performance, 395 hồ sơ môn Toán tại Bồ Đào Nha. G3 là điểm cuối năm, không phải điểm một bài thi riêng. Chưa kiểm chứng trên học sinh Việt Nam. Dự báo sớm loại G1/G2 nhưng số lần vắng học trong UCI có thể phản ánh cả năm, do đó chưa chứng minh khả năng dự báo tại đầu năm.</p><a href="https://archive.ics.uci.edu/dataset/320/student+performance">Nguồn dữ liệu UCI</a>')}catch(e){card(`<p class="error">${esc(e.message)}</p><p>Nếu chưa có dữ liệu, tải student-mat.csv từ UCI và đặt cạnh app.py, sau đó khởi động lại.</p>`)}}
$('nav').innerHTML=pages.map((p,i)=>`<button onclick="show(${i})">${p}</button>`).join('');show(0);
</script></html>
